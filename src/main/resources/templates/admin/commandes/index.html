<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: head}"></head>

<body class="admin_page">

<div th:replace="~{layout/base :: layout(~{::section})}">
    <section>

        <div class="d-flex justify-content-between align-items-stretch gap-2 mb-3">
            <h1 class="mb-0">Récapitulatif des commandes</h1>

            <form method="get" class="d-flex align-items-center">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox"
                           name="seulementCommandes"
                           value="true"
                           th:checked="${seulementCommandes}"
                           onchange="this.form.submit()"/>
                    <label class="form-check-label">
                        Afficher seulement les produits commandés
                    </label>
                </div>
                <input type="hidden" name="seulementCommandes" value="false"/>
            </form>

            <div class="d-flex align-items-center gap-2">

                <form method="post" th:action="@{/admin/commandes/sync}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-warning btn-change" style="height: 59px;"
                            onclick="return confirm('Confirmer la synchronisation ? Toutes les données du tableau seront écrasées')">
                        Synchroniser
                    </button>
                </form>

                <form method="post" th:action="@{/admin/commandes/reset}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-danger btn-change" style="height: 59px;"
                            onclick="return confirm('Confirmer la suppression ? Toutes les données des commandes clients et du tableau récapitulatif seront supprimées')">
                        Remettre à zéro
                    </button>
                </form>

                <a class="btn btn-primary btn-export"
                   style="height: 59px"
                   th:href="@{/admin/commandes/export}">
                    Exporter en Excel
                </a>

            </div>
        </div>

        <!-- ORDERS LIST -->
        <div th:each="order : ${orders}"
             class="d-flex align-items-center border rounded p-3 mb-2">

    <span th:text="${order.user.name + ' a enregistré une commande le ' +
    #temporals.format(order.date, 'EEEE dd MMMM à HH''h''mm')}"></span>

            <form th:action="@{/admin/commandes/{id}/delete(id=${order.id})}"
                  method="post"
                  class="ms-auto">

                <button type="submit" class="btn btn-sm btn-outline-primary">
                    ×
                </button>

            </form>
        </div>

        <!-- FORM SAVE GLOBAL -->
        <form id="saveForm">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <table class="table table-striped table-hover table-bordered align-middle">

                <thead>
                <tr>
                    <th>Produit</th>

                    <th th:each="client, iterStat : ${clients}"
                        th:classappend="${client.inputMode == 'ORDER'
                        and (iterStat.first
                        or clients[iterStat.index - 1].inputMode == 'STOCK')} ? 'separator-col' : ''">

                        <a th:href="@{/admin/commandes/edit/{id}(id=${client.id})}"
                           th:text="${client.name}">
                        </a>

                    </th>

                    <th>À faire</th>

                </tr>
                </thead>


                <tbody>

                <tr th:each="product, pStat : ${products}"
                    th:classappend="${product.category == 'boeuf'} ? 'table-boeuf'
                   : (${product.category == 'veau'} ? 'table-veau'
                   : 'table-porc')">

                    <td th:text="${product.name}"></td>

                    <td class="sync-cell"
                        th:each="client, cStat : ${clients}"
                        th:classappend="${client.inputMode == 'ORDER'
                            and (cStat.first
                            or clients[cStat.index - 1].inputMode == 'STOCK')} ? 'separator-col' : ''"
                        th:with="i=${pStat.index * clients.size() + cStat.index}"
                        th:attr="data-mode=${client.inputMode}">
                        <!-- ========================= -->
                        <!-- COMMON DATA (TOUJOURS) -->
                        <!-- ========================= -->

                        <input type="hidden"
                               th:name="'items[' + ${i} + '].userId'"
                               th:value="${client.id}" />

                        <input type="hidden"
                               th:name="'items[' + ${i} + '].productId'"
                               th:value="${product.id}" />

                        <input type="hidden"
                               th:name="'items[' + ${i} + '].quantity'"
                               th:value="${quantities[client.id] != null ? quantities[client.id][product.id] : 0}" />

                        <!-- ========================= -->
                        <!-- STOCK MODE (READ ONLY) -->
                        <!-- ========================= -->

                        <div class="d-flex justify-content-between align-items-center">

                    <span th:text="${quantities[client.id] != null ? quantities[client.id][product.id] : 0}">
                    </span>

                            <input th:if="${quantities[client.id] != null
                                    and quantities[client.id][product.id] != 0}"
                                   type="number"
                                   min="0"
                                   class="form-control form-control-sm text-end ms-auto"
                                   style="width:65px;"
                                   th:name="'items[' + ${i} + '].doneQuantity'"
                                   th:value="${doneQuantities[client.id] != null ? doneQuantities[client.id][product.id] : 0}" />

                        </div>

                    </td>

                    <td class="todo-cell text-center fw-bold"
                        th:id="'todo-' + ${product.id}">
                    </td>

                </tr>

                </tbody>

            </table>

        </form>

    </section>
</div>

<script>

    const csrfToken =
        document.querySelector('meta[name="_csrf"]').content;

    const csrfHeader =
        document.querySelector('meta[name="_csrf_header"]').content;


    /* =========================
       STATE CENTRAL
    ========================= */

    const state = new Map();   // key -> item
    const dirty = new Set();   // keys à sync
    const syncStatus = new Map(); // key -> pending/saved/error

    let syncTimer = null;

    document.querySelectorAll("input[name$='doneQuantity']").forEach(input => {

        input.addEventListener("keydown", (e) => {
            if (e.key === " ") {
                e.preventDefault();
            }
        });

    });


    /* =========================
       KEY UTIL
    ========================= */

    function getKey(userId, productId) {
        return productId + "-" + userId;
    }


    /* =========================
       UI STATUS (1 badge unique)
    ========================= */

    function setStatusUI(cell, status) {

        let badge = cell.querySelector(".sync-badge");

        if (!badge) {
            badge = document.createElement("span");
            badge.className = "sync-badge";
            cell.appendChild(badge);
        }

        badge.textContent = "";

        if (status === "pending") badge.textContent = "⏳";
        else if (status === "saved") badge.textContent = "✔";
        else if (status === "error") badge.textContent = "❌";
    }


    /* =========================
       INIT STATE FROM DOM
    ========================= */

    document.querySelectorAll("input[name$='doneQuantity']").forEach(input => {

        const row = input.closest("tr");
        const cell = input.closest("td");

        const userId = cell.querySelector("[name$='userId']").value;
        const productId = row.querySelector("[name$='productId']").value;

        const key = getKey(userId, productId);
        const mode = cell.dataset.mode;

        state.set(key, {
            userId,
            productId,
            mode,
            quantity: cell.querySelector("[name$='quantity']").value,
            doneQuantity: normalizeNumber(input.value)
        });

        syncStatus.set(key, "idle");
    });

    // Calcul initial de la colonne "à faire" pour chaque produit
    (function initTodoColumn() {
        const productIds = new Set();
        state.forEach(item => productIds.add(item.productId));
        productIds.forEach(pid => updateTodoCell(pid));
    })();

    function normalizeNumber(value) {

        if (value === null || value === undefined) return 0;

        const cleaned = String(value).trim();

        if (cleaned === "") return 0;

        const parsed = Number(cleaned);

        if (Number.isNaN(parsed)) return 0;

        return parsed;
    }


    /* =========================
       COLONNE "À FAIRE"
       (uniquement clients en mode COMMANDE)
    ========================= */

    function computeTodoForProduct(productId) {

        const pid = String(productId);
        let total = 0;

        state.forEach(item => {

            if (String(item.productId) !== pid) return;
            if (item.mode !== 'ORDER') return;

            const qty = normalizeNumber(item.quantity);
            const done = normalizeNumber(item.doneQuantity);
            const remaining = qty - done;

            if (remaining > 0) total += remaining;
        });

        return total;
    }

    function updateTodoCell(productId) {

        const cell = document.getElementById('todo-' + productId);
        if (!cell) return;

        const total = computeTodoForProduct(productId);

        cell.textContent = total > 0 ? total : "";
    }


    /* =========================
       SAFE CELL RESOLUTION
    ========================= */

    function findCell(item) {

        const inputs = document.querySelectorAll(
            `input[name$='productId'][value='${item.productId}']`
        );

        for (const input of inputs) {

            const cell = input.closest("td");
            const userIdInput = cell.querySelector("[name$='userId']");

            if (userIdInput && userIdInput.value == item.userId) {
                return cell;
            }
        }

        return null;
    }


    /* =========================
       INPUT HANDLER
    ========================= */

    document.querySelectorAll("input[name$='doneQuantity']").forEach(input => {

        input.addEventListener("input", () => {

            const row = input.closest("tr");
            const cell = input.closest("td");

            const userId = cell.querySelector("[name$='userId']").value;
            const productId = row.querySelector("[name$='productId']").value;

            const key = getKey(userId, productId);

            const item = state.get(key);
            if (!item) return;

            item.doneQuantity = input.value;

            state.set(key, item);
            dirty.add(key);

            syncStatus.set(key, "pending");
            setStatusUI(cell, "pending");

            updateTodoCell(productId);

            scheduleSync();
        });

    });


    /* =========================
       DEBOUNCE SYNC ENGINE
    ========================= */

    function scheduleSync() {

        clearTimeout(syncTimer);

        syncTimer = setTimeout(() => {
            syncDirty();
        }, 300);
    }


    /* =========================
       BATCH SYNC
    ========================= */

    async function syncDirty() {

        if (dirty.size === 0) return;

        const payload = Array.from(dirty).map(key => state.get(key));

        dirty.clear();

        try {

            await fetch('/admin/commandes/batch', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(payload)
            });

            // SUCCESS UI
            payload.forEach(item => {

                const key = getKey(item.userId, item.productId);
                syncStatus.set(key, "saved");

                const cell = findCell(item);
                if (cell) setStatusUI(cell, "saved");

                updateTodoCell(item.productId);
            });

        } catch (e) {

            console.error("SYNC FAILED", e);

            payload.forEach(item => {

                const key = getKey(item.userId, item.productId);
                syncStatus.set(key, "error");

                const cell = findCell(item);
                if (cell) setStatusUI(cell, "error");

                dirty.add(key);
            });
        }
    }


    /* =========================
       BEFORE UNLOAD (backup)
    ========================= */

    window.addEventListener("beforeunload", () => {

        if (dirty.size === 0) return;

        const payload = Array.from(dirty).map(key => state.get(key));

        navigator.sendBeacon(
            '/admin/commandes/batch',
            new Blob([JSON.stringify(payload)], {
                type: 'application/json'
            })
        );
    });

</script>
<footer th:replace="~{layout/base :: footer}"></footer>
</body>
</html>
